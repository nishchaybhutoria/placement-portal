name: cds-observability

x-restart: &restart
  restart: unless-stopped

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/rules:/etc/prometheus/rules:ro,Z
      - prometheus_data:/prometheus
    networks: [observability]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *restart

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro,Z
      - loki_data:/loki
    networks: [observability]
    mem_limit: 1g
    cpus: 1.0
    <<: *restart

  alloy:
    image: grafana/alloy:v1.8.3
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    networks: [observability]
    mem_limit: 512m
    cpus: 0.5
    depends_on: [loki]
    <<: *restart

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - ${ALERT_SECRETS_DIR:-/home/cdsuser/cds-secrets/alertmanager}/alert_webhook_token:/run/secrets/alert_webhook_token:ro,Z
      - alertmanager_data:/alertmanager
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25
    <<: *restart

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - ${ALERT_SECRETS_DIR:-/home/cdsuser/cds-secrets/alertmanager}/grafana_admin_password:/run/secrets/grafana_admin_password:ro,Z
      - grafana_data:/var/lib/grafana
    networks: [observability]
    mem_limit: 384m
    cpus: 0.5
    depends_on: [prometheus, loki]
    <<: *restart

  node-exporter:
    image: prom/node-exporter:v1.9.0
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25
    <<: *restart

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:-/home/docker-data}:/var/lib/docker:ro,Z
      - /dev/disk:/dev/disk:ro
    networks: [observability]
    mem_limit: 256m
    cpus: 0.5
    <<: *restart

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-cds}?sslmode=disable
      DATA_SOURCE_USER: cds_monitor
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-cds_monitor}
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25
    <<: *restart

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro,Z
      - /etc/pki/tls/certs/ca-bundle.crt:/etc/blackbox_exporter/ca-bundle.crt:ro
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25
    <<: *restart

networks:
  observability:
    external: true
    name: cds-observability

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  alertmanager_data:
  grafana_data:
