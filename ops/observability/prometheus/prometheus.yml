global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: placement-portal

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: cds-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]

  - job_name: cds-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8002]

  - job_name: backup
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [backup:9100]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://cdsportal.example.edu/healthz
          - https://cdsportal.example.edu/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
