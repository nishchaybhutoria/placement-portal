[project]
name = "placement-portal-backend"
version = "0.1.0"
description = "Auditable placement and internship workflow backend"
readme = "../README.md"
license = "Apache-2.0"
authors = [{ name = "Nishchay Bhutoria" }]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "alembic",
    "asyncpg",
    "authlib",
    "boto3>=1.43.78",
    "fastapi",
    "httpx",
    "openpyxl",
    "procrastinate",
    "prometheus-client>=0.21,<1",
    "pydantic>=2",
    "python-multipart",
    "sqlalchemy>=2",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/nishchaybhutoria/placement-portal"
Repository = "https://github.com/nishchaybhutoria/placement-portal"
Issues = "https://github.com/nishchaybhutoria/placement-portal/issues"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv"]
strict = ["app/core", "app/domain"]
venvPath = "."
venv = ".venv"
