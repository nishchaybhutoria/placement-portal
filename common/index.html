<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IIT Gandhinagar Career Development Services" />
    <title>Career Development Services | IIT Gandhinagar</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #182230; }
      main { width: min(760px, calc(100% - 2rem)); padding: 3rem; border: 1px solid #d8dee8; border-radius: 1rem; background: white; box-shadow: 0 16px 45px rgb(24 34 48 / 8%); }
      h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; }
      p { color: #536174; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
      a { display: inline-block; padding: .8rem 1.15rem; border-radius: .55rem; background: #8b1d2c; color: white; font-weight: 650; text-decoration: none; }
      a.secondary { background: #e8edf3; color: #182230; }
      a:hover { filter: brightness(.94); }
    </style>
  </head>
  <body>
    <main>
      <p>Indian Institute of Technology Gandhinagar</p>
      <h1>Career Development Services</h1>
      <p>Select a service below. Access to the placement portal requires an authorized institute account.</p>
      <nav aria-label="CDS services">
        <a href="/portal/">Placement Portal</a>
        <a class="secondary" href="/mock/">Mock Portal</a>
      </nav>
    </main>
  </body>
</html>
